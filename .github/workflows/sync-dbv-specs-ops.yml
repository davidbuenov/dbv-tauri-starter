name: Sync dbv-specs-ops

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  subtree-pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # El driver de merge `ours` NO viene definido de fábrica en git: sin esta línea, las reglas
      # `merge=ours` del .gitattributes de la raíz se ignoran y el subtree pull entra en conflicto
      # en project.config.md / memory.md / task.md (plantillas en el framework, estado real aquí),
      # haciendo fallar el paso sin abrir ningún PR. Ver .gitattributes para el razonamiento.
      - name: Define the `ours` merge driver (requerido por .gitattributes)
        run: git config merge.ours.driver true

      - name: Pull latest dbv-specs-ops via subtree
        id: subtree
        run: |
          set -e
          BEFORE=$(git rev-parse HEAD)
          git subtree pull --prefix=dbv-specs-ops https://github.com/davidbuenov/dbv-specs-ops.git master --squash -m "chore: sync dbv-specs-ops framework"
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.subtree.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-dbv-specs-ops
          title: "chore: sync dbv-specs-ops framework"
          body: |
            Trae automáticamente los últimos cambios de [dbv-specs-ops](https://github.com/davidbuenov/dbv-specs-ops) vía `git subtree pull`.

            ⚠️ **`dbv-specs-ops/project.config.md`, `memory.md` y `task.md` NO se actualizan en este PR** — están marcados `merge=ours` en `.gitattributes` porque aquí contienen el estado real del starter, no las plantillas del framework. Si esta sincronización trae una versión nueva del framework, **sube a mano el campo `Framework Version` de `project.config.md`**.

            Revisa el diff dentro de `dbv-specs-ops/` antes de mergear — no debería tocar nada fuera de esa carpeta.
          commit-message: "chore: sync dbv-specs-ops framework"
          delete-branch: true
